name: TrifoBet - eliminar VM

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: Escribe ELIMINAR_TRIFOBET para destruir solo la infraestructura de este repositorio
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trifobet-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirmacion == 'ELIMINAR_TRIFOBET' }}
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /home/runner/.oci/api_key.pem
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_admin_ssh_cidr: ${{ vars.OCI_ADMIN_SSH_CIDR }}
      TF_VAR_ssh_source_cidr: 127.0.0.1/32
    steps:
      - uses: actions/checkout@v6
      - name: Preparar clave OCI
        env:
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
        run: |
          install -d -m 700 "$HOME/.oci"
          printf '%s\n' "$OCI_API_KEY_PEM" > "$HOME/.oci/api_key.pem"
          chmod 600 "$HOME/.oci/api_key.pem"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Abrir estado exclusivo de TrifoBet
        working-directory: infra/terraform
        env:
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$OCI_STATE_BUCKET" \
            -backend-config="namespace=$OCI_NAMESPACE" \
            -backend-config="key=trifobet/terraform.tfstate" \
            -backend-config="tenancy_ocid=$TF_VAR_tenancy_ocid" \
            -backend-config="user_ocid=$TF_VAR_user_ocid" \
            -backend-config="fingerprint=$TF_VAR_fingerprint" \
            -backend-config="private_key_path=$TF_VAR_private_key_path" \
            -backend-config="region=$TF_VAR_region"
      - name: Comprobar identidad del estado
        working-directory: infra/terraform
        run: |
          terraform state list | grep -Fx 'oci_core_instance.app'
          terraform state show oci_core_instance.app | grep -F 'trifobet-ubuntu-2404'
      - name: Destruir VM y red de TrifoBet
        working-directory: infra/terraform
        run: terraform destroy -input=false -auto-approve
