name: "sunner01:despliegue docker con framework"
run-name: "sunner01:despliegue docker con framework - TrifoBet"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trifobet-dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./trifobet-backend
            repository: trifobet-backend
          - service: web
            context: ./trifobet-casino (4)
            repository: trifobet-web
          - service: admin
            context: ./TrifoBetAdmin
            repository: trifobet-admin
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Validar secretos
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo "Falta DOCKER_USERNAME"; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo "Falta DOCKER_PASSWORD (token de Docker Hub)"; exit 1; }

      - name: Crear repositorio Docker Hub si falta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ matrix.repository }}
        run: python3 scripts/ensure-dockerhub-repository.py

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.repository }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.repository }}:practica
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Crear OCI y configurar con Ansible
    needs: publish
    runs-on: ubuntu-24.04
    concurrency:
      group: trifobet-infrastructure
      cancel-in-progress: false
    timeout-minutes: 50
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /home/runner/.oci/api_key.pem
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_admin_ssh_cidr: ${{ vars.OCI_ADMIN_SSH_CIDR }}
      APP_TAG: ${{ github.sha }}
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Validar configuración
        env:
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
        run: |
          for name in OCI_API_KEY_PEM OCI_SSH_PRIVATE_KEY OCI_STATE_BUCKET OCI_NAMESPACE TF_VAR_tenancy_ocid TF_VAR_compartment_ocid TF_VAR_user_ocid TF_VAR_fingerprint TF_VAR_region TF_VAR_ssh_public_key BACKEND_ENV; do
            test -n "${!name}" || { echo "Falta $name"; exit 1; }
          done
      - name: Preparar claves privadas
        env:
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.oci" "$HOME/.ssh"
          printf '%s\n' "$OCI_API_KEY_PEM" > "$HOME/.oci/api_key.pem"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/trifobet"
          chmod 600 "$HOME/.oci/api_key.pem" "$HOME/.ssh/trifobet"
          ssh-keygen -y -f "$HOME/.ssh/trifobet" >/dev/null
      - name: Limitar SSH a este ejecutor
        run: |
          ip=$(curl -4fsS --retry 3 https://api.ipify.org)
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "TF_VAR_ssh_source_cidr=$ip/32" >> "$GITHUB_ENV"
      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Abrir estado remoto
        working-directory: infra/terraform
        env:
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$OCI_STATE_BUCKET" \
            -backend-config="namespace=$OCI_NAMESPACE" \
            -backend-config="key=trifobet/terraform.tfstate" \
            -backend-config="tenancy_ocid=$TF_VAR_tenancy_ocid" \
            -backend-config="user_ocid=$TF_VAR_user_ocid" \
            -backend-config="fingerprint=$TF_VAR_fingerprint" \
            -backend-config="private_key_path=$TF_VAR_private_key_path" \
            -backend-config="region=$TF_VAR_region"
      - name: Crear o actualizar VM
        working-directory: infra/terraform
        run: |
          terraform validate
          terraform apply -input=false -auto-approve
      - name: Obtener IP pública
        id: vm
        working-directory: infra/terraform
        run: echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Preparar Ansible
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar Ansible
        run: python -m pip install 'ansible-core>=2.18,<2.21'
      - name: Esperar SSH
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          for attempt in {1..30}; do
            echo "Esperando SSH: intento $attempt"
            if ssh-keyscan -T 5 -H "$PUBLIC_IP" > "$RUNNER_TEMP/trifobet-hostkeys" 2>/dev/null && test -s "$RUNNER_TEMP/trifobet-hostkeys"; then
              cat "$RUNNER_TEMP/trifobet-hostkeys" >> "$HOME/.ssh/known_hosts"
              break
            fi
            sleep 10
          done
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i "$HOME/.ssh/trifobet" "ubuntu@$PUBLIC_IP" 'echo SSH_OK'
      - name: Configurar Docker, Git, firewall y servicios
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          ansible-playbook -i "${PUBLIC_IP}," -u ubuntu \
            --private-key "$HOME/.ssh/trifobet" infra/ansible/site.yml
      - name: Mostrar URL temporal de Cloudflare
        id: tunnel
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          url=$(ssh -o BatchMode=yes -i "$HOME/.ssh/trifobet" "ubuntu@$PUBLIC_IP" \
            "cd /opt/trifobet && sudo docker compose logs --no-color cloudflared 2>&1 | grep -oE 'https://[a-z0-9-]+[.]trycloudflare[.]com' | tail -n 1")
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Web: $url"
          echo "Administración: $url/admin"
      - name: Verificar sitio público
        env:
          SITE_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          curl -4fsS --retry 10 --retry-all-errors --retry-delay 5 "$SITE_URL/api/pais" >/dev/null
          curl -4fsS --retry 10 --retry-all-errors --retry-delay 5 "$SITE_URL/" >/dev/null
